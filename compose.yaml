# Querier with each notebook session in a Firecracker microVM.
#   docker compose up -d             → http://localhost:3000 (the published image)
#   docker compose up -d --build     → built from this checkout instead
services:
  querier:
    build: .
    image: ghcr.io/leonardomb1/querier:${QUERIER_VERSION:-latest}
    # the sysadmin (QUERIER_ADMIN_USER, QUERIER_ADMIN_PASSWORD_HASH) and other settings: see .env.example
    env_file: .env
    ports: ["3000:3000"]
    volumes:
      - querier-data:/data   # notebooks; config/: connections.json, auth.json, querier.db (sessions, audit), all mode 600
    devices:
      - /dev/kvm             # microVMs need KVM
      - /dev/net/tun         # and a tap each, for the ones allowed a network
    # nothing but what the sandboxes need: taps and nftables for their network (in
    # this container's namespace, never the host's), dropping Firecracker to its own
    # user, chown of each VM's files, and stopping VMs
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, KILL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_forward: "1"
    restart: unless-stopped
volumes:
  querier-data:
