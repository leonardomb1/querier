# Tests, then the image. Only when source changes: the server, the web app, the
# kernel, the tests, the image and what builds them; not the README, the license
# or the example settings.
#
# A tag v1.2.3 publishes the image to ghcr.io/leonardomb1/querier as `1.2.3`,
# `1.2`, `1` (from 1.0 on) and `latest`, and makes a GitHub release (a tag always
# runs: GitHub doesn't filter tag pushes by path). Main and pull requests only
# build it.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &source
      - "server/**"
      - "web/**"
      - "shared/**"
      - "kernel/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *source
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request replaces a run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: Dockerfile

      # what the local kernel runs with, as the microVM's image has it: the same
      # basalt release and Python packages, read from the Dockerfile
      - name: basalt
        run: |
          version=$(sed -n 's/^ARG BASALT_VERSION=//p' Dockerfile)
          base="https://github.com/leonardomb1/basalt/releases/download/${version}"
          curl -fsSL -o /tmp/basalt "${base}/basalt-x86_64-linux"
          curl -fsSL -o /tmp/basalt.sha256 "${base}/basalt-x86_64-linux.sha256"
          echo "$(cut -d' ' -f1 /tmp/basalt.sha256)  /tmp/basalt" | sha256sum -c -
          sudo install -m 755 /tmp/basalt /usr/local/bin/basalt
          basalt --version

      - name: The kernel's Python
        run: |
          mapfile -t packages < <(sed -n '/pip install/,/&&/p' Dockerfile | grep -oE '[A-Za-z_]+==[0-9][0-9.]*')
          echo "packages: ${packages[*]}"
          uv venv .venv --python 3.13
          uv pip install --python .venv/bin/python "${packages[@]}"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Tests
        run: bun test --timeout 180000

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # from the tag v1.2.3: 1.2.3, 1.2, 1 (not 0 for 0.x) and latest
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build, and publish from a tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags || format('querier:{0}', github.sha) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          fence='```'
          notes="${fence}sh
          docker pull ghcr.io/${GITHUB_REPOSITORY}:${version}
          ${fence}"
          flags=()
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --notes "$notes" "${flags[@]}"
